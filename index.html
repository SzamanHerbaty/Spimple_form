<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        
        <main>
            <div id="logo_section">
                <div id="logo">
                    <img src="odin-lined.png"/>
                    <h1>ODIN</h1>
                </div>
                <p class="credits">
                    Photo by <a href="https://unsplash.com/@makhortov_art?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Artem Makhortov</a> 
                    on <a href="https://unsplash.com/photos/a-house-on-a-rocky-shore-with-a-mountain-in-the-background-CdVg8-XvKC4?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a>
                </p>
            </div>
            <div id="form_section">
                <h3>
                    This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. 
                    Sign up now to get started.
                </h3>
                <h3>You <span style="font-style: italic;">know</span> you want to</h3>

                <fieldset>
                    <legend>Let's do this!</legend>
                    <form action method="post">
                        <div id="inputs_container">
                            <div class="form_row">
                                <div class="label_container">
                                    <label for="first_name">First name:</label>
                                    <input type="text" id="first_name" minlength="3" name="first_name" required/>
                                </div>
                                <div class="label_container">
                                    <label for="second_name">Second name:</label>
                                    <input type="text" id="second_name" minlength="3" name="second_name" required/>
                                </div>
                            </div>
                            <div class="form_row">
                                <div class="label_container">
                                    <label for="email">Email:</label>
                                    <input type="email" id="email" name="email" required/>
                                </div>   
                                <div class="label_container">
                                    <label for="phone_number">Phone Number:</label>
                                    <input type="tel" id="phone_number" name="phone_number" pattern="[0-9]{9}" />
                                </div> 
                            </div>
                            <div class="form_row">
                                <div class="label_container">
                                    <label for="password">Password:</label>
                                    <input type="password" id="password" minlength="6" name="password" required/>
                                </div> 
                                <div class="label_container">   
                                    <label for="confirm_password">Confirm Password:</label>
                                    <input type="password" id="confirm_password" minlength="6" name="confirm_password" required/>
                                </div> 
                            </div>
                        </div>
                        <button type="submit">Submit</button>
                    </form>
                </fieldset>
            </div>
        </main>
        <script src="" async defer></script>
    </body>
</html>
